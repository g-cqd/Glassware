name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new push lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Why a single iOS-Simulator job rather than splitting logic vs snapshot:
# the package targets .iOS(.v26) and .macOS(.v26). The GitHub-hosted
# macos-15 runner ships macOS 15 at runtime, where SwiftUI lacks iOS-26
# additions like `GlassEffectContainer`. `swift test` on the host fails
# to dlopen the test bundle (symbol not found). xcodebuild against an
# iOS 26 simulator is the only environment where the library actually
# loads, so both logic and snapshot tests run there.

jobs:
  tests:
    name: Tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26* | sort -V | tail -1)"
          xcodebuild -version

      - name: Install Metal Toolchain
        # Xcode 26 ships the Metal compiler as a separately-downloadable
        # component. AemiSDR's MetalShaderBuildPlugin invokes `metal` during
        # build, so the toolchain must be present.
        #
        # Apple's MobileAsset CDN intermittently returns "Failed fetching
        # catalog" — observed once during this workflow's bring-up. Retry
        # with backoff before giving up so a single CDN blip doesn't fail
        # a PR run.
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            echo "Metal toolchain download attempt $attempt..."
            sudo xcodebuild -downloadComponent MetalToolchain
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "Metal toolchain installed."
              exit 0
            fi
            echo "Download failed (status $status); sleeping $((attempt * 10))s before retry."
            sleep $((attempt * 10))
          done
          echo "Metal toolchain still unavailable after 5 attempts." >&2
          exit 1

      - name: Resolve simulator UDID
        # The runner image installs multiple iOS simulator runtimes (e.g.
        # 26.0 and 26.2 both ship with Xcode 26.3). Passing `OS=latest`
        # in -destination produces the
        #   "xcodebuild: WARNING: Using the first of multiple matching
        #    destinations"
        # warning, which obscures real diagnostics. Resolving a specific
        # UDID at runtime sidesteps that — and adapts automatically when
        # the runner image updates its iOS SDK.
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys, re
          data = json.load(sys.stdin)
          # Pick the highest-versioned iOS runtime, then an iPhone 17 Pro
          # within it (any modern iPhone would work; pinning to one model
          # makes baselines deterministic).
          runtimes = sorted(
              [k for k in data['devices'] if 'SimRuntime.iOS' in k],
              key=lambda k: tuple(int(p) for p in re.findall(r'\d+', k))
          )
          for rt in reversed(runtimes):
              for device in data['devices'][rt]:
                  if device['name'] == 'iPhone 17 Pro':
                      print(device['udid'])
                      sys.exit(0)
          sys.exit('No iPhone 17 Pro simulator available')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"

      - name: Run tests
        # Both targets in one invocation: xcodebuild caches the build
        # between -only-testing entries, so running them together halves
        # the build time vs two separate `xcodebuild test` calls.
        # `-skipPackagePluginValidation` allows AemiSDR's
        # MetalShaderBuildPlugin to run without an interactive trust
        # prompt (CI runner has no UI). `-skipMacroValidation` does the
        # same for swift-syntax macros pulled in transitively by
        # swift-snapshot-testing.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Glassware \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:GlasswareTests \
            -only-testing:GlasswareSnapshotTests \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-result-bundle
          path: TestResults.xcresult
          retention-days: 7

      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failure-images
          # SnapshotTesting writes both `*-failure-*` (the diff) and the
          # original `actual` PNG next to the committed baseline when an
          # assertion fails. Uploading both lets reviewers compare in the
          # GHA UI without checking the branch out.
          path: |
            **/__Snapshots__/**/*failure*.png
            **/__Snapshots__/**/*actual*.png
          retention-days: 7
          if-no-files-found: ignore
