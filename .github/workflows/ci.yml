name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new push lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Why a single iOS-Simulator job rather than splitting logic vs snapshot:
# the package targets .iOS(.v26) and .macOS(.v26). The GitHub-hosted
# macos-15 runner ships macOS 15 at runtime, where SwiftUI lacks iOS-26
# additions like `GlassEffectContainer`. `swift test` on the host fails
# to dlopen the test bundle (symbol not found). xcodebuild against an
# iOS 26 simulator is the only environment where the library actually
# loads, so both logic and snapshot tests run there.

jobs:
  tests:
    name: Tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26* | sort -V | tail -1)"
          xcodebuild -version

      - name: Install Metal Toolchain
        # Xcode 26 ships the Metal compiler as a separately-downloadable
        # component. AemiSDR's MetalShaderBuildPlugin invokes `metal` during
        # build, so the toolchain must be present.
        run: sudo xcodebuild -downloadComponent MetalToolchain

      - name: List available iOS simulators
        run: xcrun simctl list devices available | grep -i iphone

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme Glassware

      - name: Run logic tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Glassware \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:GlasswareTests \
            -enableCodeCoverage NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run snapshot tests
        # `-skipPackagePluginValidation` allows AemiSDR's MetalShaderBuildPlugin
        # to run without an interactive trust prompt (CI runner has no UI).
        # `-skipMacroValidation` does the same for swift-syntax macros pulled
        # in transitively by swift-snapshot-testing.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Glassware \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:GlasswareSnapshotTests \
            -enableCodeCoverage NO \
            -resultBundlePath SnapshotTestResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-result-bundle
          path: SnapshotTestResults.xcresult
          retention-days: 7

      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failure-images
          # SnapshotTesting writes both `*-failure-*` (the diff) and the
          # original `actual` PNG next to the committed baseline when an
          # assertion fails. Uploading both lets reviewers compare in the
          # GHA UI without checking the branch out.
          path: |
            **/__Snapshots__/**/*failure*.png
            **/__Snapshots__/**/*actual*.png
          retention-days: 7
          if-no-files-found: ignore
